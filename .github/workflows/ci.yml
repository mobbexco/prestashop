name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [5.6, 7.0, 7.4, 8.0, 8.2]

    steps:
    - uses: actions/checkout@v3
    - name: Setup PHP with tools
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer
    - name: Install dependencies
      run: composer install --dev --working-dir=./mobbex
    - name: Execute PHP Paralel Lint
      run: mobbex/vendor/php-parallel-lint/php-parallel-lint/parallel-lint ./mobbex --exclude mobbex/vendor

    # Check that version exists and is consistent across the module
    - name: Check version consistency across the module
      run: |
        CONFIG_VER=$(sed -n "s/.*const MODULE_VERSION *= *'\([^']*\)'.*/\1/p" mobbex/Models/Config.php)
        HEADER_VER=$(sed -n "s/^ \* @version \(.*\)$/\1/p" mobbex/mobbex.php)
        echo "Config::MODULE_VERSION = $CONFIG_VER"
        echo "mobbex.php @version    = $HEADER_VER"
        test -n "$CONFIG_VER" || { echo "could not read MODULE_VERSION"; exit 1; }
        test "$CONFIG_VER" = "$HEADER_VER" || { echo "version mismatch"; exit 1; }
